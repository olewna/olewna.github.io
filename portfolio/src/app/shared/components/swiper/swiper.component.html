<!-- Konfigurację przekazujemy jako atrybuty HTML -->
<swiper-container 
    class="swiper-container"
    [ngClass]="theme()" 
    slides-per-view="1"
    slides-per-group="1"
    space-between="30" 
    navigation="true" 
    pagination="true"
    autoHeight="true"
    rewind="true"
    >

    @if (!isVideos) {
        @for (image of images; track $index) {
            <swiper-slide class="swiper-slide">
                    <img [src]="image.url" [alt]="title + ' image'" class="swiper-image">
            </swiper-slide>
        }
    } @else {
        @for (video of videos; track $index) {
            <swiper-slide class="swiper-slide">
                <video controls class="swiper-image">
                    <source [src]="video.url"  type="video/mp4">
                    <p>{{title}} video</p>
                </video>
            </swiper-slide>
        }
    }
</swiper-container>
